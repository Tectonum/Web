<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Table</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<table>
    <tr class="orange">
        <td>1</td>
        <td>2</td>
        <td>3</td>
        <td>4</td>
    </tr>
    <tr class="orange">
        <td>5</td>
        <td rowspan="2" class="blue">6</td>
        <td>7</td>
        <td>8</td>
    </tr>
    <tr class="orange">
        <td>9</td>
        <td>11</td>
        <td>12</td>
    </tr>
    <tr class="orange">
        <td>13</td>
        <td class="red">14</td>
        <td>15</td>
        <td>16</td>
    </tr>
    <tr class="orange">
        <td>17</td>
        <td class="red">18</td>
        <td>19</td>
        <td>20</td>
    </tr>
    <tr class="orange">
        <td>21</td>
        <td class="red">22</td>
        <td>23</td>
        <td>24</td>
    </tr>
    <tr>
        <td class="orange">25</td>
        <td colspan="3" class="green">26</td>
    </tr>
    <tr class="blue">
        <td class="orange">29</td>
        <td>30</td>
        <td>31</td>
        <td>32</td>
    </tr>
</table>
</body>
</html>
